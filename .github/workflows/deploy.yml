name: Secure Deploy Static Security Analyzer to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate static site security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reject accidental sensitive files
        run: |
          set -euo pipefail
          if find . -type f \
            ! -path './.git/*' \
            ! -path './node_modules/*' \
            \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name 'id_rsa' -o -name 'id_ed25519' -o -name '*.p12' -o -name '*.pfx' \) \
            | grep -q .; then
            echo "Sensitive-looking files must not be deployed to GitHub Pages." >&2
            exit 1
          fi

      - name: Check for inline script handlers
        run: |
          set -euo pipefail
          if grep -RInE 'on(click|load|error|mouseover|submit)=' index.html assets; then
            echo "Inline event handlers violate the site CSP. Move code into assets/js/*.js." >&2
            exit 1
          fi

      - name: Build minimal publish directory
        run: |
          set -euo pipefail
          mkdir -p public/assets/js public/assets/css
          cp index.html public/
          cp assets/js/*.js public/assets/js/
          if compgen -G "assets/css/*" > /dev/null; then cp assets/css/* public/assets/css/; fi
          cp README.md public/README.md

      - name: Upload validated artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
